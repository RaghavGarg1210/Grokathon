# Georgia cities County Crier monitors.
#
# `handles` are official X accounts (mayor + city government), without "@". Max 20 per city.
# Only posts from these accounts are accepted. Leave them empty and run
# `python -m scripts.discover_handles` for search-backed suggestions, then review
# config/sources.suggested.yaml and apply with `--apply`.
#
# `domains` are the city's official websites. Their news pages are scanned for announcements
# (so a city with domains but no handles can still be monitored) and used for verification.
# City domains come first; state_domains fill the remaining verification slots (max 5 total).

state_domains:
  - georgia.gov
  - dca.ga.gov
  - georgia.org

cities:
  - city: Atlanta
    county: Fulton
    mayor: ""
    lat: 33.749
    lon: -84.388
    rural: false
    handles: []
    domains: [atlantaga.gov]

