[project]
name = "county-crier"
version = "0.1.0"
description = "Turns Georgia mayors' X announcements into verified explainer videos for small businesses."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
